schema_version = "1.0.0"

id = "mcedit2blender"
version = "0.2.0"
name = "MCEdit2Blender"
tagline = "Import Minecraft .schematic and .schem files as blocks"
maintainer = "MCEdit2Blender contributors"
type = "add-on"

website = "https://github.com/ConnorKrammer/MCEdit2Blender"
tags = ["Import-Export"]

blender_version_min = "4.2.0"

license = [
  "SPDX:GPL-3.0-or-later",
]

[permissions]
files = "Read Minecraft schematic files and the block textures"

[build]
paths_exclude_pattern = ["__pycache__/", "/.git/", "*.zip", "test_*.py", ".gitignore", "/textures/"]
